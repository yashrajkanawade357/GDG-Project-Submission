<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tandem keeps your preferences identical across every open browser tab." />
    <title>Tandem</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='17' height='17' fill='%23171614'/%3E%3Crect x='12' y='4' width='17' height='17' fill='none' stroke='%23d9431e' stroke-width='3'/%3E%3C/svg%3E"
    />
    <script>
      // Runs before the first paint. Applies the saved preferences so a newly opened tab never
      // shows the wrong theme, text size or language, not even for one frame.
      // Must stay in step with src/sync/schema.ts; tests/boot.test.ts checks that it does.
      (function () {
        var root = document.documentElement;
        var dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var size = 16;
        var lang = 'en';
        try {
          var saved = JSON.parse(localStorage.getItem('settings-sync:v1') || 'null');
          var f = (saved && saved.v === 1 && saved.fields) || {};
          var d = f.darkMode && f.darkMode.value;
          var s = f.fontSize && f.fontSize.value;
          var l = f.language && f.language.value;
          if (typeof d === 'boolean') dark = d;
          if (typeof s === 'number' && s % 1 === 0 && s >= 12 && s <= 24) size = s;
          if (typeof l === 'string' && /^(en|hi|es|fr|de|ja)$/.test(l)) lang = l;
        } catch (e) {
          // Storage blocked or corrupted: fall back to the defaults above.
        }
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.style.fontSize = size + 'px';
        root.lang = lang;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Tandem needs JavaScript to keep settings in sync between tabs.</noscript>
  </body>
</html>
